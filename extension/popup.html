<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PPX Auto-Rename</title>
    <link rel="stylesheet" href="pixel-ui.css" />
  </head>
  <body class="popup-page">
    <div class="popup-stack">
      <!-- Brand Header + Master Toggle -->
      <header class="brand-card">
        <div class="brand-left">
          <div id="popup-logo-slot"></div>
          <div>
            <h1 class="brand-title">PPX Auto-Rename</h1>
            <div class="brand-sub">3-7 Word Thread Titler</div>
          </div>
        </div>
        <label class="toggle-row header-toggle" for="popup-enabled">
          <span id="popup-enabled-label">ON</span>
          <input id="popup-enabled" type="checkbox" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </header>

      <!-- Live Last Rename Status -->
      <div id="popup-status-box" class="status-banner">
        <div class="status-row">
          <strong id="popup-status-summary">No rename activity yet</strong>
          <span id="popup-status-badge" class="badge">IDLE</span>
        </div>
        <div id="popup-status-detail" class="hint" style="margin: 0">
          Ask a question in a fresh Perplexity tab to auto-rename.
        </div>
      </div>

      <!-- Current Open Chat + Batch Library Actions -->
      <section class="card" aria-label="Chat & Library Actions">
        <div class="status-row" style="margin-bottom: 8px">
          <h2 style="margin: 0">Chat &amp; Library Actions</h2>
          <span id="popup-open-chat-badge" class="badge">READY</span>
        </div>

        <div class="action-pair" style="margin-bottom: 10px">
          <button id="popup-rename-current-btn" type="button" class="primary" style="padding: 7px 10px; font-size: 9.5px">
            Rename Chat
          </button>
          <button id="popup-regen-current-btn" type="button" style="padding: 7px 10px; font-size: 9.5px">
            ↻ Regenerate
          </button>
        </div>

        <div id="popup-current-feedback" class="feedback" role="status" style="margin-bottom: 8px"></div>

        <div class="field" style="margin-bottom: 8px">
          <label for="popup-batch-preset">Batch Rename Library</label>
          <div class="batch-inline-row">
            <select id="popup-batch-preset">
              <option value="count:50">Past 50 Chats</option>
              <option value="days:20">Last 20 Days of Library</option>
              <option value="days:30">Last 30 Days of Library</option>
              <option value="count:20">Past 20 Chats</option>
              <option value="days:7">Last 7 Days of Library</option>
              <option value="all">Rename All Library Chats</option>
              <option value="custom-count">Custom Chat Count…</option>
              <option value="custom-days">Custom Day Range…</option>
            </select>
            <input
              id="popup-batch-custom"
              type="number"
              class="batch-custom-input hidden"
              min="1"
              max="5000"
              value="100"
              aria-label="Custom batch number"
            />
          </div>
        </div>

        <div class="status-row">
          <label class="mini-check-row" for="popup-skip-renamed">
            <input id="popup-skip-renamed" type="checkbox" checked />
            <span>Skip already-renamed</span>
          </label>
          <div style="display: flex; gap: 6px">
            <button id="popup-start-batch-btn" type="button" class="primary" style="padding: 6px 11px; font-size: 9.5px">
              Run Batch
            </button>
            <button id="popup-stop-batch-btn" type="button" class="danger hidden" style="padding: 6px 11px; font-size: 9.5px">
              ■ Stop
            </button>
          </div>
        </div>

        <div id="popup-batch-progress" class="batch-progress-box hidden">
          <div class="batch-progress-top">
            <span id="popup-batch-label" class="batch-progress-label">Scanning library…</span>
            <span id="popup-batch-pct" class="batch-progress-pct">0%</span>
          </div>
          <div class="pixel-progress-track">
            <div id="popup-batch-fill" class="pixel-progress-fill"></div>
          </div>
          <div class="batch-stats-row">
            <span id="popup-batch-stats">0 renamed · 0 skipped</span>
          </div>
        </div>
      </section>

      <!-- Quick Provider & Key Configuration -->
      <section class="card" aria-label="Provider & Key">
        <h2>Provider &amp; Key</h2>

        <div class="field">
          <label for="popup-provider">Provider</label>
          <select id="popup-provider"></select>
        </div>

        <div class="field">
          <label for="popup-model">Model</label>
          <input id="popup-model" type="text" spellcheck="false" autocomplete="off" />
        </div>

        <div id="popup-custom-url-wrap" class="field hidden">
          <label for="popup-custom-url">Custom Base URL</label>
          <input
            id="popup-custom-url"
            type="url"
            placeholder="https://example.com/v1"
            spellcheck="false"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <div class="status-row" style="margin-bottom: 5px">
            <label for="popup-api-key" style="margin-bottom: 0">API Key</label>
            <span id="popup-key-badge" class="badge">…</span>
          </div>
          <input
            id="popup-api-key"
            type="password"
            placeholder="Paste API key"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="actions" style="margin-top: 10px; gap: 8px">
          <button id="popup-save-btn" type="button" class="primary" style="flex: 1">
            Save
          </button>
          <button id="popup-test-btn" type="button" style="flex: 1">
            Test LLM
          </button>
        </div>

        <div id="popup-feedback" class="feedback" role="status"></div>
      </section>

      <!-- Toaster & Prefix (No Website Theme Option) -->
      <section class="card" aria-label="Toaster & Prefix">
        <h2>Toaster &amp; Prefix</h2>

        <div class="field">
          <label class="toggle-row" for="popup-show-toast">
            <span>Bottom-Right Rename Toaster</span>
            <input id="popup-show-toast" type="checkbox" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>

        <div class="field" style="margin-bottom: 0">
          <label for="popup-prefix">Title Prefix (Optional)</label>
          <input
            id="popup-prefix"
            type="text"
            placeholder="e.g. [Research]"
            autocomplete="off"
          />
        </div>
      </section>

      <!-- Footer -->
      <footer class="popup-footer">
        <div class="inline-group" style="gap: 6px">
          <span id="popup-perm-badge" class="badge">HOST …</span>
          <button id="popup-grant-btn" type="button" class="hidden" style="padding: 5px 10px; font-size: 9.5px">
            Grant Access
          </button>
        </div>
        <button id="popup-open-options" type="button" style="padding: 6px 12px; font-size: 9.5px">
          Full Settings ↗
        </button>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
